name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Package mod
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(jq -er '.version | select(type == "string" and length > 0)' mod.txt)"
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "::error::tag (${GITHUB_REF_NAME}) does not match mod version (v${VERSION})"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_ENV"

      - name: Generate update metadata
        shell: bash
        run: |
          set -euo pipefail

          ident="$(jq -r '.updates[0].identifier // empty' mod.txt)"
          version="$(jq -r '.version' mod.txt)"
          repo="$GITHUB_REPOSITORY"

          if [[ -z "$ident" ]]; then
            echo "has_update_metadata=false" >> "$GITHUB_ENV"
            echo "No mod.txt updates[0].identifier configured; skipping update metadata."
            exit 0
          fi

          mkdir -p generated
          jq -n \
            --arg ident "$ident" \
            --arg version "$version" \
            --arg download_url "https://github.com/$repo/releases/download/v$version/ClientsideStealth.zip" \
            --arg patchnotes_url "https://github.com/$repo/releases/tag/v$version" \
            '[{
              ident: $ident,
              version: $version,
              download_url: $download_url,
              patchnotes_url: $patchnotes_url
            }]' > generated/update_meta.json

          echo "has_update_metadata=true" >> "$GITHUB_ENV"

      - name: Build SuperBLT zip
        shell: bash
        run: |
          set -euo pipefail

          rm -rf package ClientsideStealth.zip
          mkdir -p package/ClientsideStealth
          cp -R lua loc assets mod.txt rpc.xml supermod.xml package/ClientsideStealth/

          cd package
          zip -r ../ClientsideStealth.zip ClientsideStealth

      - name: Get previous tag
        id: previous-tag
        shell: bash
        run: |
          set -euo pipefail

          previous_tag="$(git --no-pager tag --sort=creatordate --merged "${GITHUB_REF_NAME}" | grep -v "^${GITHUB_REF_NAME}$" | tail -1 || true)"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        if: ${{ steps.previous-tag.outputs.previous_tag != '' }}
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          fromTag: ${{ github.ref_name }}
          toTag: ${{ steps.previous-tag.outputs.previous_tag }}
          writeToFile: false
          restrictToTypes: feat,fix,perf
          useGitmojis: false
          includeInvalidCommits: false

      - name: Write release notes
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changes }}
          PREVIOUS_TAG: ${{ steps.previous-tag.outputs.previous_tag }}
        shell: bash
        run: |
          set -euo pipefail

          printf 'ClientsideStealth %s\n' "$version" > release-notes.md
          if [[ -n "$CHANGELOG" ]]; then
            printf '\n%s\n' "$CHANGELOG" >> release-notes.md
          elif [[ -z "$PREVIOUS_TAG" ]]; then
            printf '\nInitial release.\n' >> release-notes.md
          else
            printf '\nMaintenance release.\n' >> release-notes.md
          fi

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          assets=(ClientsideStealth.zip)
          if [[ "${has_update_metadata}" == "true" ]]; then
            assets+=(generated/update_meta.json)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "$TAG" --notes-file release-notes.md
          fi

  nexus:
    name: Upload to Nexus Mods
    needs: package
    if: ${{ vars.NEXUSMODS_ENABLED == 'true' }}
    permissions:
      contents: read
    environment: nexusmods
    runs-on: ubuntu-latest

    steps:
      - name: Download GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          gh release download "$TAG" --pattern ClientsideStealth.zip
          echo "version=${TAG#v}" >> "$GITHUB_ENV"

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ secrets.NEXUSMODS_FILE_ID }}
          filename: ClientsideStealth.zip
          version: ${{ env.version }}
          primary_mod_manager_download: true
          update_mod_version: true
